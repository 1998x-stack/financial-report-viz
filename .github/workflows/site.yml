name: Build, Validate and Publish Financial Report Atlas
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Validate primary-source data, registry and accounting
        run: python scripts/validate_data.py
      - name: Numerical regression tests
        run: python -m unittest discover -s tests -v
      - name: Render website and original SVGs
        run: python scripts/build_site.py
      - name: Validate generated HTML, links, JSON-LD and SVG assets
        run: python scripts/check_site.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser QA desktop/mobile/print/offline
        run: python scripts/browser_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-atlas-browser-review
          path: reports/browser
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: financial-atlas-dist
          path: dist/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install jsonschema==4.25.1
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
